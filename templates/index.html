{% extends "base.html" %}

{% block title %}BC125AT Controller{% endblock %}

{% block content %}
<div class="dashboard">

  <!-- ── Status display ── -->
  <section class="panel panel--display">
    <div class="display-screen">
      <div class="display-freq" id="display-freq">--- --- MHz</div>
      <div class="display-meta">
        <span class="display-channel" id="display-channel">--</span>
        <span class="display-mod" id="display-mod">--</span>
      </div>
      <div class="display-name" id="display-name">&nbsp;</div>
      <div class="display-icons">
        <span class="icon-pill" id="icon-squelch">SQ</span>
        <span class="icon-pill" id="icon-mute">MUTE</span>
        <span class="icon-pill signal-wrap">
          <span class="signal-bar" id="sig-1"></span>
          <span class="signal-bar" id="sig-2"></span>
          <span class="signal-bar" id="sig-3"></span>
          <span class="signal-bar" id="sig-4"></span>
          <span class="signal-bar" id="sig-5"></span>
        </span>
        <span class="icon-pill battery-pill">
          <span class="battery-icon">
            <span class="battery-fill" id="battery-fill"></span>
          </span>
          <span id="battery-volts">--V</span>
        </span>
        <span class="icon-pill rec-pill" id="rec-indicator">
          <span class="rec-dot"></span>
          REC <span id="rec-timer">0:00</span>
        </span>
      </div>
    </div>
  </section>

  <!-- ── Controls row ── -->
  <div class="controls-row">

    <!-- Keypad -->
    <section class="panel panel--keypad">
      <p class="panel-label">keypad</p>
      <div class="keypad-grid">
        <button class="key key--action" data-key="scan">Scan</button>
        <button class="key key--action" data-key="hold">Hold</button>
        <button class="key key--action" data-key="search">Search</button>
        <button class="key key--action" data-key="weather">WX</button>

        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key key--nav" data-key="up">▲</button>

        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key key--nav" data-key="down">▼</button>

        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key key--nav" data-key="lockout">L/O</button>

        <button class="key" data-key="dot">.</button>
        <button class="key" data-key="0">0</button>
        <button class="key key--enter" data-key="enter">E</button>
        <button class="key key--func" data-key="func">Func</button>
      </div>
      <div class="channel-jump">
        <input type="number" id="channel-input" class="channel-input" min="1" max="500" placeholder="Ch 1–500">
        <button class="key key--action" id="channel-go">Go</button>
      </div>
    </section>

    <!-- Right column: levels + recording + log -->
    <section class="panel panel--levels">

      <div class="levels-top">

        <!-- Left side: sliders + backlight -->
        <div class="levels-left">
          <p class="panel-label">levels</p>

          <div class="level-group">
            <div class="level-header">
              <span class="level-name">Volume</span>
              <span class="level-value" id="vol-value">--</span>
            </div>
            <input type="range" class="level-slider" id="vol-slider" min="0" max="15" value="8" step="1">
            <div class="level-ticks"><span>0</span><span>5</span><span>10</span><span>15</span></div>
          </div>

          <div class="level-group">
            <div class="level-header">
              <span class="level-name">Squelch</span>
              <span class="level-value" id="sql-value">--</span>
            </div>
            <input type="range" class="level-slider" id="sql-slider" min="0" max="15" value="3" step="1">
            <div class="level-ticks"><span>0</span><span>5</span><span>10</span><span>15</span></div>
          </div>

          <div class="level-group">
            <div class="level-header">
              <span class="level-name">Backlight</span>
              <span class="level-value" id="blt-value">--</span>
            </div>
            <div class="backlight-btns">
              <button class="blt-btn" data-mode="AO">Always on</button>
              <button class="blt-btn" data-mode="SQ">Squelch</button>
              <button class="blt-btn" data-mode="KY">Keypress</button>
              <button class="blt-btn" data-mode="AF">Off</button>
            </div>
          </div>
        </div>

        <!-- Right side: recording + log -->
        <div class="levels-right">
          <p class="panel-label">recording</p>

          <div class="rec-compact">
            <div class="rec-compact-status">
              <span class="level-name">Status</span>
              <span class="level-value rec-status-text" id="rec-status-text">idle</span>
            </div>
            <div class="rec-compact-controls">
              <button class="rec-btn rec-btn--start" id="rec-start">
                <span class="rec-dot"></span>Record
              </button>
              <button class="rec-btn rec-btn--stop" id="rec-stop" disabled>■ Stop</button>
            </div>
            <div class="rec-file" id="rec-file">&nbsp;</div>
          </div>

          <div class="level-group log-group" style="margin-top:12px">
            <div class="level-header">
              <span class="level-name">Activity</span>
              <button class="log-clear" id="log-clear">Clear</button>
            </div>
            <div class="activity-log" id="activity-log">
              <span class="log-empty">No activity yet</span>
            </div>
          </div>
        </div>

      </div>

      <!-- Recordings list — full width inside the panel -->
      <div class="recordings-section">
        <div class="recordings-header">
          <span class="level-name">Recordings</span>
          <button class="log-clear" id="recordings-refresh">Refresh</button>
        </div>
        <div class="recordings-list" id="recordings-list">
          <span class="log-empty">No recordings yet</span>
        </div>
      </div>

    </section>

  </div>
</div>
{% endblock %}
