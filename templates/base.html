<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}BC125AT Controller{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <span class="header-logo">
          <span class="logo-dot" id="connection-dot"></span>
          BC125AT
        </span>
        <span class="header-sub">web controller</span>
      </div>
      <nav class="tab-nav">
        <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
        <button class="tab-btn" data-tab="channels">Channels</button>
        <button class="tab-btn" data-tab="settings">Settings</button>
      </nav>
      <div class="header-right">
        <span class="header-status" id="connection-status">connecting...</span>
      </div>
    </div>
  </header>

  <main class="site-main">
    <!-- Dashboard tab -->
    <div class="tab-pane active" id="tab-dashboard">
      {% block dashboard %}{% endblock %}
    </div>

    <!-- Channels tab -->
    <div class="tab-pane" id="tab-channels">
      {% block channels %}{% endblock %}
    </div>

    <!-- Settings tab -->
    <div class="tab-pane" id="tab-settings">
      {% block settings %}{% endblock %}
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='js/socket.js') }}"></script>
  <script src="{{ url_for('static', filename='js/tabs.js') }}"></script>
  <script src="{{ url_for('static', filename='js/channels.js') }}"></script>
  <script src="{{ url_for('static', filename='js/settings.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
