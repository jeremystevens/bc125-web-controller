name: Python CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify Python files compile
        run: |
          python -m compileall .

      - name: Verify Flask app imports
        run: |
          python -c "import app"

      - name: Run unit tests (if present)
        run: |
          if [ -d tests ]; then
            python -m pytest
          else
            echo "No tests directory found. Skipping."
          fi
